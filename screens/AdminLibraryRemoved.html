<script>
(function(){
  var g=document.querySelector('[role="group"][aria-label="종류"]');if(!g)return;
  var rows=[].slice.call(document.querySelectorAll('table thead ~ tbody tr'));
  var cnt=[].slice.call(document.querySelectorAll('span')).filter(function(x){return /^전체 <b>[\d,]+건<\/b>/.test(x.innerHTML.trim());})[0];
  g.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;e.preventDefault();e.stopPropagation();
    var want=b.textContent.replace(/\s*[\d,]+$/,'').trim();
    [].slice.call(g.querySelectorAll('button')).forEach(function(x){var on=x===b;x.setAttribute('aria-pressed',on?'true':'false');if(on){x.style.border='1px solid #103070';x.style.background='#e9eef7';x.style.color='#0a2050';x.style.fontWeight='700';}else{x.style.border='1px solid #c2cad9';x.style.background='#ffffff';x.style.color='#3a4253';x.style.fontWeight='600';}});
    var n=0;rows.forEach(function(tr){var k=tr.children[0].textContent.trim();var show=(want==='전체')||k===want;tr.style.display=show?'':'none';if(show)n++;});
    if(cnt)cnt.innerHTML=(want==='전체'?'전체':want)+' <b>'+n+'건</b>';
  },true);
})();
