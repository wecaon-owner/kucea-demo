<div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; border-bottom: 2px solid #103070; margin-bottom: 12px;">
<h2 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.005em;">회원 탈퇴</h2>
<button aria-label="닫기" style="width: 44px; height: 44px; border: 0; background: transparent; color: #3a4253; cursor: pointer; display: flex; align-items: center; justify-content: center;" type="button"></button>
</div>
<p style="margin: 0; font-size: 16px; font-weight: 600;">㈜세와글로벌, 131-86-02417</p>
<p style="margin: 0; padding: 12px 16px; background: #fdeced; border: 1px solid #f8cfd2; border-radius: 4px; color: #8f1c2a; font-size: 16px; font-weight: 600;">탈퇴하면 바로 로그인과 원부조회가 닫힙니다. 다시 쓰려면 가입 신청부터 새로 해야 합니다.</p>
<div style="border-top: 1px solid #d9dfea;"><div style="display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid #e4e8f0;"><span style="flex: 0 0 120px; font-weight: 700; color: #8f1c2a;">닫히는 것</span></div><div style="display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid #e4e8f0;"><span style="flex: 0 0 120px; font-weight: 700; color: #0f5d3a;">남겨 두는 것</span><span style="color: #3a4253;">원부조회 기록 (국토부 점검 대비), 처리 기록</span></div></div>

<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="w-why" style="font-size: 14px; font-weight: 400;">탈퇴 이유 (선택)</label>
<select id="w-why" style="height: 44px; box-sizing: border-box; border: 1px solid #c2cad9; border-radius: 4px; padding: 0 12px; font-size: 16px; font-family: inherit; background: #ffffff;">
<option>선택하세요</option>
<option>사업을 접음</option>
<option>더 이상 쓰지 않음</option>
<option>기타</option>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="w-pw" style="font-size: 14px; font-weight: 400;">비밀번호 확인</label>
<input id="w-pw" style="height: 44px; box-sizing: border-box; border: 1px solid #c2cad9; border-radius: 4px; padding: 0 16px; font-size: 16px; font-family: inherit;" type="password"/>
</div>
<label style="display: flex; align-items: center; gap: 8px; cursor: pointer;"><input style="width: 22px; height: 22px; margin: 0; accent-color: #8f1c2a;" type="checkbox"/>탈퇴하면 되돌릴 수 없다는 것을 확인했습니다</label>
<div style="display: flex; justify-content: flex-end; gap: 8px;">
<button style="height: 44px; padding: 0 20px; border: 1px solid #c2cad9; border-radius: 4px; background: #ffffff; color: #3a4253; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer;" type="button">취소</button>
<button style="height: 44px; padding: 0 24px; border: 0; border-radius: 4px; background: #8f1c2a; color: #ffffff; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer;" type="button">회원 탈퇴</button>

</div>
